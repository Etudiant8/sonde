# Shadowreef, sonde installée chez le client : trois conteneurs, aucune donnée ne quitte la machine.
# Lancé par scripts/installer.sh avec le fichier /etc/shadowreef/shadowreef.env.
name: shadowreef

x-shadowreef: &shadowreef
  image: shadowreef:local
  restart: unless-stopped          # redémarrage automatique après coupure de courant (N8)
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp"]
  logging: &journaux
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  suricata:
    image: shadowreef-suricata:local
    restart: unless-stopped
    network_mode: host             # nécessaire pour écouter la carte reliée au port miroir
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW, SYS_NICE, CHOWN, DAC_OVERRIDE, SETUID, SETGID]
    environment:
      SHADOWREEF_INTERFACE: ${SHADOWREEF_INTERFACE:?Indiquez la carte reliée au port miroir}
    volumes:
      - journaux:/var/log/suricata
      - regles:/var/lib/suricata
    logging: *journaux

  analyse:
    <<: *shadowreef
    command: ["surveiller"]
    volumes:
      - donnees:/var/lib/shadowreef
      - journaux:/var/log/suricata
      - ${SHADOWREEF_REGLAGES:-/etc/shadowreef}:/etc/shadowreef:ro
    healthcheck:
      test: ["CMD", "shadowreef", "etat"]
      interval: 5m
      timeout: 30s
      start_period: 45m

  web:
    <<: *shadowreef
    command: ["web", "--adresse", "0.0.0.0:8443",
              "--certificat", "/etc/shadowreef/tls/shadowreef.crt", "--cle", "/etc/shadowreef/tls/shadowreef.key"]
    ports:
      - "${SHADOWREEF_PORT_WEB:-8443}:8443"
    volumes:
      - donnees:/var/lib/shadowreef
      - ${SHADOWREEF_REGLAGES:-/etc/shadowreef}:/etc/shadowreef:ro

volumes:
  donnees:
  journaux:
  regles:
