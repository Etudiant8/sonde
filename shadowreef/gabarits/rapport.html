{% extends "base.html" %}
{% block titre %}Rapport{% endblock %}
{% block contenu %}
<section class="etroit">
  <h1>Rapport PDF</h1>
  <p>Le rapport reprend l'inventaire, les incidents, les points faibles et les recommandations.</p>
  <form method="post" class="pile">
    <input type="hidden" name="jeton" value="{{ jeton }}">
    <label>Période
      <select name="jours">
        <option value="7">7 derniers jours</option>
        <option value="30" selected>30 derniers jours</option>
        <option value="90">90 derniers jours</option>
      </select>
    </label>
    <button>Télécharger le rapport</button>
  </form>
</section>
{% endblock %}
